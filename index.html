<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thot - Éditeur Markdown & Export PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Barre d'outils supérieure (masquée à l'impression) -->
      <header class="app-header no-print">
        <div class="brand">
          <span class="logo-icon">𓁟</span>
          <div class="brand-text">
            <h1>Thot</h1>
            <span class="tagline">Éditeur Markdown & Export PDF</span>
          </div>
        </div>

        <div class="toolbar-actions">
          <div class="control-group">
            <label for="font-select">Police :</label>
            <select id="font-select" class="select-input">
              <optgroup label="Polices Système">
                <option value="Arial, sans-serif">Arial</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
              </optgroup>
              <optgroup label="Google Fonts">
                <option value="Roboto" selected>Roboto</option>
                <option value="Open Sans">Open Sans</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Inter">Inter</option>
                <option value="Lora">Lora</option>
                <option value="Merriweather">Merriweather</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Fira Code">Fira Code</option>
              </optgroup>
            </select>
          </div>

          <div class="control-group">
            <label class="checkbox-container" title="Afficher ou masquer la numérotation des pages">
              <input type="checkbox" id="toggle-footer" />
              <span class="checkbox-checkmark"></span>
              <span class="checkbox-text">Numéros de page</span>
            </label>
          </div>

          <button id="export-pdf-btn" class="btn-primary" title="Imprimer ou enregistrer au format PDF (Ctrl+P)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            <span>Exporter en PDF</span>
          </button>
        </div>
      </header>

      <!-- Zone principale à double panneau -->
      <main class="main-container">
        <!-- Panneau d'édition Markdown (masqué à l'impression) -->
        <section class="editor-pane no-print">
          <div class="pane-header">
            <h2>Éditeur Markdown</h2>
            <div class="stats-badge">
              <span id="page-count-badge">1 page</span> • <span id="word-count">0 mots</span> • <span id="char-count">0 caractères</span>
            </div>
          </div>
          <textarea
            id="markdown-input"
            placeholder="Écrivez ou collez votre document Markdown ici..."
            spellcheck="true"
          ></textarea>
        </section>

        <!-- Panneau d'aperçu / rendu multi-pages A4 -->
        <section class="preview-pane">
          <div class="pane-header no-print">
            <h2>Aperçu A4</h2>
            <span class="preview-hint" id="preview-page-indicator">Feuilles A4 (210mm × 297mm)</span>
          </div>
          <div id="preview-canvas" class="preview-canvas">
            <!-- Les pages .a4-page sont générées dynamiquement ici -->
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
