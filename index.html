<!DOCTYPE html>
<html lang="fr" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thot — Éditeur Markdown & Export PDF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Barre d'outils supérieure inspirée du site web -->
      <header class="app-header no-print">
        <div class="header-left">
          <div class="brand">
            <span class="brand-logo">𓁟</span>
            <div class="brand-info">
              <span class="brand-title">Thot</span>
              <span class="brand-badge">Markdown to PDF</span>
            </div>
          </div>
        </div>

        <div class="toolbar-actions">
          <div class="control-group">
            <label for="font-select">Typographie</label>
            <select id="font-select" class="select-input">
              <optgroup label="Polices Système">
                <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Sans-Serif (Défaut)</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
              </optgroup>
              <optgroup label="Google Fonts">
                <option value="Inter" selected>Inter</option>
                <option value="Roboto">Roboto</option>
                <option value="Open Sans">Open Sans</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Lora">Lora</option>
                <option value="Merriweather">Merriweather</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Fira Code">Fira Code</option>
              </optgroup>
            </select>
          </div>

          <div class="control-group">
            <label class="checkbox-container" title="Afficher ou masquer la numérotation des pages">
              <input type="checkbox" id="toggle-footer" />
              <span class="checkbox-label">Numéros de page</span>
            </label>
          </div>

          <button id="export-pdf-btn" class="btn-primary" title="Exporter au format PDF A4 (Ctrl+P)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            <span>Exporter en PDF</span>
          </button>
        </div>
      </header>

      <!-- Zone principale bicolonne -->
      <main class="main-container">
        <!-- Panneau d'édition Markdown -->
        <section class="editor-pane no-print">
          <div class="pane-header">
            <div class="pane-title">
              <span class="dot-indicator"></span>
              <h2>Éditeur Markdown</h2>
            </div>
            <div class="stats-badge">
              <span id="page-count-badge">1 page</span> • <span id="word-count">0 mots</span> • <span id="char-count">0 caractères</span>
            </div>
          </div>
          <textarea
            id="markdown-input"
            placeholder="Rédigez votre document en Markdown..."
            spellcheck="true"
          ></textarea>
        </section>

        <!-- Panneau d'aperçu multi-pages A4 -->
        <section class="preview-pane">
          <div class="pane-header no-print">
            <div class="pane-title">
              <h2>Aperçu Impression</h2>
            </div>
            <span class="preview-hint" id="preview-page-indicator">Feuilles A4 (210mm × 297mm)</span>
          </div>
          <div id="preview-canvas" class="preview-canvas">
            <!-- Feuilles A4 générées dynamiquement -->
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
