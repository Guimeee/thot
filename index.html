<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimalist, 100% client-side Markdown editor with live A4 pagination and native vector PDF export." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="64x64" href="./thot_icon_64.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="./thot_icon_128.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="./thot_icon_256.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./thot_icon_512.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./thot_icon_128.png" />
    <link rel="apple-touch-icon" sizes="256x256" href="./thot_icon_256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./thot_icon_512.png" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Thot — Markdown Editor & Native A4 PDF Exporter" />
    <meta property="og:description" content="Minimalist, 100% client-side Markdown editor with live A4 pagination and native vector PDF export." />
    <meta property="og:image" content="./thot_icon_512.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="./thot_icon_512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <!-- Minimalist top toolbar -->
      <header class="app-header no-print">
        <div class="header-left">
          <div class="brand">
            <img src="./thot_icon_64.png" alt="Thot logo" class="brand-logo" width="24" height="24" />
            <div class="brand-info">
              <span class="brand-title">Thot</span>
              <span class="brand-badge">Markdown to PDF</span>
            </div>
          </div>
        </div>

        <div class="toolbar-actions">
          <div class="control-group">
            <label for="font-select">Typography</label>
            <select id="font-select" class="select-input">
              <optgroup label="System Fonts">
                <option value="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Sans-Serif (Default)</option>
                <option value="Arial, sans-serif">Arial</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
              </optgroup>
              <optgroup label="Google Fonts">
                <option value="Inter" selected>Inter</option>
                <option value="Roboto">Roboto</option>
                <option value="Open Sans">Open Sans</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Lora">Lora</option>
                <option value="Merriweather">Merriweather</option>
                <option value="Playfair Display">Playfair Display</option>
                <option value="Fira Code">Fira Code</option>
              </optgroup>
            </select>
          </div>

          <div class="control-group">
            <label class="checkbox-container" title="Show or hide page numbers">
              <input type="checkbox" id="toggle-footer" />
              <span class="checkbox-label">Page numbers</span>
            </label>
          </div>

          <button id="export-pdf-btn" class="btn-primary" title="Export to A4 PDF (Ctrl+P)">
            <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 6 2 18 2 18 9"></polyline>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
              <rect x="6" y="14" width="12" height="8"></rect>
            </svg>
            <span>Export to PDF</span>
          </button>
        </div>
      </header>

      <!-- Main dual-pane container -->
      <main class="main-container">
        <!-- Markdown editor pane (White minimalist) -->
        <section class="editor-pane no-print">
          <div class="pane-header">
            <div class="pane-title">
              <span class="dot-indicator"></span>
              <h2>Markdown Editor</h2>
            </div>
            <div class="stats-badge">
              <span id="page-count-badge">1 page</span> • <span id="word-count">0 words</span> • <span id="char-count">0 characters</span>
            </div>
          </div>
          <textarea
            id="markdown-input"
            placeholder="Write your Markdown document here..."
            spellcheck="true"
          ></textarea>
        </section>

        <!-- StackEdit-style A4 preview pane -->
        <section class="preview-pane">
          <div class="pane-header no-print">
            <div class="pane-title">
              <h2>Print Preview</h2>
            </div>
            <span class="preview-hint" id="preview-page-indicator">A4 Sheets (210mm × 297mm)</span>
          </div>
          <div id="preview-canvas" class="preview-canvas">
            <!-- Dynamically generated A4 sheets -->
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
